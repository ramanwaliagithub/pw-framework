[project]
name = "pw-framework"
version = "1.0.0"
description = "Enterprise-grade Playwright + Python test automation framework"
authors = [{ name = "Automation Architecture Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.56.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-playwright>=0.5.2,<0.6.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "pytest-rerunfailures>=14.0,<15.0",
    "pytest-html>=4.1.1,<5.0.0",
    "allure-pytest>=2.13.5,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "faker>=28.0.0,<29.0.0",
    "sqlalchemy>=2.0.34,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "requests>=2.32.3,<3.0.0",
    "axe-playwright-python>=0.1.4,<0.2.0",
    "pillow>=10.4.0,<11.0.0",
    "pypdf>=4.3.1,<5.0.0",
]

[dependency-groups]
dev = [
    "black>=24.8.0,<25.0.0",
    "ruff>=0.6.4,<0.7.0",
    "isort>=5.13.2,<6.0.0",
    "mypy>=1.11.2,<2.0.0",
    "flake8>=7.1.1,<8.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
