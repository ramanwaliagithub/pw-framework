[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: critical-path tests that must pass before any deploy
    regression: full regression suite, run nightly
    sanity: quick post-deploy sanity checks
    api: API-layer tests (no browser)
    ui: browser-driven UI tests
    accessibility: a11y checks
    slow: tests known to take >30s, excluded from fast local runs

addopts =
    -ra
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results
    --html=reports/html/report.html
    --self-contained-html
    --reruns 1
    --reruns-delay 2
    --junitxml=reports/junit/results.xml

; Parallel execution: invoke with `-n auto` (pytest-xdist) at the CLI/CI
; level rather than baking a fixed worker count here, since the right
; number of workers depends on the runner's CPU count (local dev laptop
; vs a GitHub Actions 4-core runner vs a 32-core self-hosted box).
;
; Retry policy: --reruns 1 covers transient flakiness (a slow CDN response,
; a momentary network blip) WITHOUT masking real bugs — a test that fails
; twice in a row is treated as a genuine failure, not swallowed. This is
; a deliberate, conservative default; regression/nightly CI overrides it
; to --reruns 2 for known-flaky external integrations (see workflows).

log_cli = false
