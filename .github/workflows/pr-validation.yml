name: PR Validation

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Black (format check)
        run: uv run black --check src tests

      - name: isort (import order check)
        run: uv run isort --check-only src tests

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: mypy (type check)
        run: uv run mypy src

  smoke-tests:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke tests
        env:
          TEST_ENV: qa
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: uv run pytest -m smoke -n auto --alluredir=reports/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: reports/allure-results
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.browser }}
          path: reports/html/report.html
          retention-days: 14

      - name: Upload failure traces/screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.browser }}
          path: |
            reports/traces
            reports/screenshots
          retention-days: 14

  api-tests:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install Playwright (API context only, no browsers needed)
        run: uv run playwright install-deps

      - name: Run API tests
        env:
          TEST_ENV: qa
        run: uv run pytest -m api -n auto

  notify:
    needs: [smoke-tests, api-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Slack notification on failure
        if: contains(needs.*.result, 'failure')
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ PR Validation failed for #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
