name: Nightly Regression

on:
  schedule:
    - cron: "0 21 * * *"  # 21:00 UTC == 02:30 IST — off-peak for the target user base
  workflow_dispatch: {}     # allow manual trigger too

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps ${{ matrix.browser }}

      - name: Run full regression suite
        env:
          TEST_ENV: staging
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: >
          uv run pytest -m regression -n auto
          --reruns 2 --reruns-delay 5
          --alluredir=reports/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-allure-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: reports/allure-results
          retention-days: 30

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-failures-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: |
            reports/traces
            reports/screenshots
            reports/videos
          retention-days: 30

  publish-report:
    needs: regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Generate combined Allure report
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: all-results
          allure_report: allure-report
          keep_reports: 30

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: nightly/${{ github.run_number }}

      - name: Notify Teams channel
        if: contains(needs.regression.result, 'failure')
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"⚠️ Nightly regression run #${{ github.run_number }} had failures. Report: https://<org>.github.io/<repo>/nightly/${{ github.run_number }}\"}" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"
